[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sbs3-control"
version = "0.1.0"
description = "Safety-first SBS-3 protocol analysis tooling"
requires-python = ">=3.9"
license = {text = "MIT"}

[project.scripts]
sbs3 = "sbs3.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
